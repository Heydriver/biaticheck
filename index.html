<title>BiatiCheck Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #ffffff;
  --bg-alt: #f7f6f2;
  --flaeche: rgba(255, 255, 255, 0.82);
  --text: #0e3b2e;
  --gedaempft: #557268;
  --linie: rgba(14, 59, 46, 0.09);
  --gruen: #1fa37e;
  --gruen-tief: #178a69;
  --blau: #2e7bb8;
  --sand: #e6e2d8;
  --mint: #e8f5f0;
  --nebel-1: #cdeadf;
  --nebel-2: #d5e5f2;
  --warn-bg: #fcefd6;
  --warn-fg: #8a5a12;
  --offen-bg: #e9ece9;
  --offen-fg: #4b5f58;
  --ok-bg: #dff3ea;
  --ok-fg: #0f6b51;
  --fehler-bg: #fde4e4;
  --fehler-fg: #9b2226;
  --schatten: 0 40px 80px -36px rgba(14, 59, 46, 0.35), 0 10px 24px -14px rgba(14, 59, 46, 0.18);
  --band: #1fa37e;
  --band-text: #ffffff;
  --dunkelkarte: #0e3b2e;
  --dunkelkarte-text: #e8f0ec;
  --schrift: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e0c; --bg-alt: #0e1210; --flaeche: rgba(20, 26, 23, 0.86); --text: #e8f0ec; --gedaempft: #99b2a7;
    --linie: rgba(255, 255, 255, 0.10); --gruen: #22c08f; --gruen-tief: #1fa37e; --blau: #3e96d4; --sand: #2a302c; --mint: #12241d;
    --nebel-1: #0f3a2c; --nebel-2: #102a3d; --warn-bg: #3a2c12; --warn-fg: #f2c66d; --offen-bg: #222a26; --offen-fg: #b8c9c1;
    --ok-bg: #133428; --ok-fg: #7fe0bd; --fehler-bg: #3b1618; --fehler-fg: #ffb3b3;
    --schatten: 0 40px 80px -36px rgba(0, 0, 0, 0.7), 0 10px 24px -14px rgba(0, 0, 0, 0.5);
    --band: #178a69; --band-text: #ffffff; --dunkelkarte: #141a17; --dunkelkarte-text: #e8f0ec; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e0c; --bg-alt: #0e1210; --flaeche: rgba(20, 26, 23, 0.86); --text: #e8f0ec; --gedaempft: #99b2a7;
  --linie: rgba(255, 255, 255, 0.10); --gruen: #22c08f; --gruen-tief: #1fa37e; --blau: #3e96d4; --sand: #2a302c; --mint: #12241d;
  --nebel-1: #0f3a2c; --nebel-2: #102a3d; --warn-bg: #3a2c12; --warn-fg: #f2c66d; --offen-bg: #222a26; --offen-fg: #b8c9c1;
  --ok-bg: #133428; --ok-fg: #7fe0bd; --fehler-bg: #3b1618; --fehler-fg: #ffb3b3;
  --schatten: 0 40px 80px -36px rgba(0, 0, 0, 0.7), 0 10px 24px -14px rgba(0, 0, 0, 0.5);
  --band: #178a69; --band-text: #ffffff; --dunkelkarte: #141a17; --dunkelkarte-text: #e8f0ec; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg-alt); color: var(--text); font-family: var(--schrift); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }
button, input, textarea { font: inherit; }
:focus-visible { outline: 3px solid var(--gruen); outline-offset: 3px; border-radius: 6px; }
.seite { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
.kopf { display: flex; align-items: center; gap: 10px; color: var(--gruen); font-weight: 600; font-size: 18px; padding: 4px 0 8px; }
.kopf svg { width: 28px; height: 31px; }
.karte { background: var(--bg); border: 1px solid var(--linie); border-radius: 20px; padding: clamp(20px, 4vw, 32px); display: grid; gap: 16px; min-width: 0; }
.karte h1 { font-size: clamp(24px, 5vw, 32px); line-height: 1.2; font-weight: 700; }
.karte h2 { font-size: 19px; font-weight: 700; }
.leise { color: var(--gedaempft); font-size: 14px; }
.dunkel { background: var(--dunkelkarte); color: var(--dunkelkarte-text); border-color: transparent; }
.dunkel .leise { color: inherit; opacity: .75; }
.knopf { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 10px; font-weight: 600; cursor: pointer; text-decoration: none; border: 1px solid transparent; }
.knopf:disabled { opacity: .55; cursor: not-allowed; }
.haupt { background: var(--gruen); color: #fff; }
.haupt:hover:not(:disabled) { background: var(--gruen-tief); }
.neben { background: var(--bg); color: var(--text); border-color: var(--linie); }
.textknopf { background: none; border: 0; padding: 0; color: var(--gruen); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.reihe { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ablage { position: relative; border: 2px dashed color-mix(in srgb, var(--gruen) 45%, var(--linie)); border-radius: 16px; padding: 28px 16px; text-align: center; display: grid; gap: 6px; justify-items: center; }
.ablage.aktiv { background: var(--mint); }
.ablage input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.ablage strong { font-size: 17px; }
.dateien { font-size: 14px; color: var(--gruen-tief); font-weight: 600; }
.einwilligung { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--gedaempft); }
.einwilligung input { width: 20px; height: 20px; margin: 1px 0 0; flex-shrink: 0; accent-color: var(--gruen); }
.meldung { font-size: 14px; color: var(--fehler-fg); }
.hinweis { font-size: 14px; background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 10px 12px; }
.laden { display: grid; gap: 10px; }
.balken { height: 6px; border-radius: 3px; background: var(--offen-bg); overflow: hidden; }
.balken div { height: 100%; width: 30%; background: var(--gruen); border-radius: 3px; animation: lauf 1.4s ease-in-out infinite; }
@keyframes lauf { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
@media (prefers-reduced-motion: reduce) { .balken div { animation: none; width: 100%; opacity: .5; } }
.fakten { display: grid; grid-template-columns: 1fr; margin: 0; border-top: 1px solid var(--linie); }
@media (min-width: 600px) { .fakten { grid-template-columns: 1fr 1fr; } .fakten > div:nth-child(-n+2) { border-bottom: 1px solid var(--linie) !important; } }
.fakten > div { padding: 14px 0; border-bottom: 1px solid var(--linie); display: grid; gap: 2px; align-content: start; }
@media (min-width: 600px) { .fakten > div { padding: 16px 16px 16px 0; border-bottom: 0; } .fakten { border-bottom: 1px solid var(--linie); } }
.fakten dt { font-size: 14px; color: var(--gedaempft); }
.fakten dd { margin: 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fakten small { font-size: 13px; color: var(--gedaempft); }
.dringend { color: var(--warn-fg); }
.datum { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.datum input { border: 1px solid var(--linie); background: var(--bg); color: var(--text); border-radius: 8px; padding: 8px 10px; min-height: 42px; }
.datum .knopf { min-height: 42px; padding: 0 16px; }
.punkte { list-style: none; margin: 0; padding: 0; }
.punkte li { display: flex; gap: 12px; justify-content: space-between; align-items: baseline; padding: 14px 0; border-top: 1px solid var(--linie); }
.punkte li:first-child { border-top: 0; padding-top: 0; }
.punkte b { display: block; font-weight: 600; }
.punkte span { color: var(--gedaempft); font-size: 15px; }
.punkte .betrag { color: var(--text); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
details summary { cursor: pointer; font-weight: 600; }
details[open] summary { margin-bottom: 12px; }
.tabelle { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tabelle td { padding: 6px 0; border-top: 1px solid var(--linie); }
.tabelle td:last-child { text-align: right; padding-left: 12px; white-space: nowrap; }
.feld { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
.feld input, .feld textarea { font-weight: 400; border: 1px solid var(--linie); background: var(--bg); color: var(--text); border-radius: 8px; padding: 10px 12px; width: 100%; }
.feld textarea { font-size: 14px; line-height: 1.55; }
.zwei { display: grid; gap: 12px; }
@media (min-width: 600px) { .zwei { grid-template-columns: 1fr 1fr; } }
[hidden] { display: none !important; }
.punkte li.befund { display: grid; gap: 8px; }
/* Berechnete Werte sind anklickbar: gepunktete Linie, darunter erscheint die kurze Erklärung */
button.wert { all: unset; cursor: pointer; text-decoration: underline dotted; text-decoration-thickness: 1px; text-underline-offset: 4px; }
button.wert:hover, button.wert[aria-expanded="true"] { text-decoration-style: solid; }
button.wert:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 4px; }
.erkl { display: block; margin-top: 6px; padding: 8px 12px; border-radius: 8px; background: var(--grund-alt, rgba(127,127,127,.12)); font-size: 14px; font-weight: 400; line-height: 1.45; letter-spacing: 0; text-transform: none; }
.punkte .kopfzeile { display: flex; gap: 12px; justify-content: space-between; align-items: baseline; }
.fakten-klein { margin: 0; display: grid; gap: 4px; background: var(--bg-alt); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.fakten-klein div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 14px; }
.fakten-klein dt { color: var(--gedaempft); }
.fakten-klein dd { margin: 0 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; }
.fakten-klein dd.betont { font-weight: 700; }
.quelle { font-size: 12px; color: var(--gedaempft); }
.schritte { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.schritte > li { display: flex; gap: 12px; align-items: flex-start; }
.schritte .nr { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--gruen); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700; margin-top: 1px; }
.schritte b { font-weight: 600; }
.schritte p { opacity: .85; font-size: 15px; }
.schritte .bis { font-weight: 600; color: #f2c66d; white-space: nowrap; }
.belege { margin: 6px 0 0; padding-left: 18px; font-size: 14px; opacity: .85; }
.neu { background: color-mix(in srgb, var(--gruen) 30%, transparent); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
</style>

<main class="seite">
  <div class="kopf"><svg viewBox="0 0 150 166" aria-hidden="true"><path fill="currentColor" d="M146.36,65.9l-.02-.07c-4.95-29.77-29.4-54.52-59.17-59.7C46.12-2.06,4.46,28.49.48,70.56c-2.95,25.01,7.8,50.85,27.54,66.21,5.56,4.26,12.8,9.15,19.34,10.4,11.26,1.29,3.81-14.25,2.48-20.15-12.19-37.82,13.72-78.55,53.37-82.84,14.61-1.66,27.1.7,31.58,16.56,8.73,28.61-4.91,60.89-31.53,74.56-7.55,3.77-25.25,11.78-26.65-1.83.04-15.71,8.44-31.95,18.96-43.52,3.59-4.05,8.73-9.17,9.17-14.31-.23-3.71-4.27-2.58-6.98-.97-3.68,2.23-7,5.66-9.97,8.84-10.89,11.88-18.3,27.01-20.94,42.92-.87,6.15-2.02,13.11.05,19.06,1.91,5.16,6.68,6.93,12.1,6.84,42.76-1.84,75.46-44.54,67.36-86.43ZM117.7,31.45v.02c-.7,1.05-2.33,1.19-4.8,1.41-7.12.22-14.86,1.07-21.69,3.14-27.92,7.81-50.11,32.72-54.17,61.54-1.11,7.36-1.11,15.09,0,22.45.4,2.92,1.26,6.34,1.6,8.73,1.56,9.14-7.94-.41-10.7-2.99C9.8,108.23,3.66,80.11,12.65,56.61c7.95-21.63,28.07-38.16,50.83-41.81,18.41-3.15,39.44,1.75,53.32,14.32.56.63,1.24,1.49.9,2.33Z"/></svg>BiatiCheck</div>

  <section class="karte" id="start">
    <h1>Nebenkostenabrechnung kostenlos prüfen</h1>
    <p class="leise">Laden Sie Ihre Abrechnung hoch. Nach ein bis drei Minuten sehen Sie, ob Sie zu viel zahlen.</p>
    <div class="ablage" id="ablage">
      <input type="file" id="datei" accept="application/pdf,image/jpeg,image/png,image/webp" multiple aria-label="Abrechnung auswählen (PDF oder Foto)">
      <strong>PDF oder Fotos auswählen</strong>
      <span class="leise">oder hierher ziehen</span>
      <span class="dateien" id="dateien"></span>
    </div>
    <label class="einwilligung"><input type="checkbox" id="einwilligung"><span>Die Datei wird zum Auslesen an Claude (Anthropic) übermittelt. Übernommen werden nur Beträge, Daten und die Postleitzahl, keine Namen.</span></label>
    <p class="meldung" id="meldung" role="alert"></p>
    <div class="reihe">
      <button class="knopf haupt" id="pruefen" type="button">Abrechnung prüfen</button>
      <button class="textknopf" id="beispiel" type="button">Beispiel ansehen</button>
    </div>
  </section>

  <section class="karte" id="laden" hidden aria-live="polite">
    <div class="laden">
      <h2 id="laden-titel">Wir lesen Ihre Abrechnung</h2>
      <p class="leise" id="laden-text">Seiten werden vorbereitet …</p>
      <p class="leise">Das dauert je nach Umfang ein bis drei Minuten.</p>
      <div class="balken"><div></div></div>
      <div><button class="textknopf" id="abbrechen" type="button">Abbrechen</button></div>
    </div>
  </section>

  <div id="ergebnis" class="seite" style="padding:0" aria-live="polite"></div>
</main>

  // Jede Seite als Bild (für Scans) und, wenn vorhanden, als Text
  const MAX_SEITEN = 30;
  async function bereiteVor(liste) {
    const seiten = []; // { bild: Blob, text: string }
    for (const d of liste) {
      if (d.type === "application/pdf" || /\.pdf$/i.test(d.name)) {
        let pdfjs;
        try {
          pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs");
          pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
        } catch { throw { code: "pdf" }; }
        let doc;
        try { doc = await pdfjs.getDocument({ data: new Uint8Array(await d.arrayBuffer()) }).promise; } catch { throw { code: "pdf" }; }
        for (let i = 1; i <= doc.numPages && seiten.length < MAX_SEITEN; i++) {
          const seite = await doc.getPage(i);
          const inhalt = await seite.getTextContent();
          const text = inhalt.items.map((t) => t.str + (t.hasEOL ? "\n" : " ")).join("").trim();
          const v1 = seite.getViewport({ scale: 1 });
          const vp = seite.getViewport({ scale: Math.min(2.5, 1400 / v1.width) });
          const c = document.createElement("canvas");
          c.width = Math.round(vp.width); c.height = Math.round(vp.height);
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
          await seite.render({ canvasContext: ctx, viewport: vp }).promise;
          seiten.push({ bild: await new Promise((r) => c.toBlob(r, "image/jpeg", 0.9)), text });
        }
      } else if (seiten.length < MAX_SEITEN) {
        seiten.push({ bild: d, text: "" });
      }
    }
    return seiten;
  }

  const ABSCHREIBEN = "Die Bilder zeigen aufeinanderfolgende Seiten einer deutschen Nebenkostenabrechnung. Schreibe den Inhalt jeder Seite vollständig und genau ab, insbesondere alle Zahlen, Beträge, Daten, Flächen, Verteilerschlüssel und Einheiten. Tabellen zeilenweise, Spalten mit \" | \" getrennt. Fußnoten, Erläuterungen, Anmerkungen und Anlagen ebenfalls wörtlich abschreiben, auch Kleingedrucktes. Beginne jede Seite mit der Zeile \"--- Seite N ---\" (N wie unten angegeben). Übernimm auch Namen, Anschriften, E-Mail-Adressen und Mieter- oder Kundennummern, aber keine Kontonummern und keine IBAN. Keine Kommentare, nur der abgeschriebene Inhalt.";

  // Seiten ohne Textebene (Scans, Fotos) in Gruppen abschreiben lassen
  async function abschreiben(seiten, maxBilder, art = "Nebenkostenabrechnung", fortschritt = (t) => ($("laden-text").textContent = t)) {
    const fehlend = seiten.map((s, i) => ({ ...s, nr: i + 1 })).filter((s) => s.text.length < 80);
    if (!fehlend.length) return;
    if (!maxBilder) throw { code: "unlesbar" };
    const gruppen = [];
    for (let i = 0; i < fehlend.length; i += maxBilder) gruppen.push(fehlend.slice(i, i + maxBilder));
    let fertig = 0;
    const melde = () => fortschritt(`Seiten werden gelesen: ${fertig} von ${fehlend.length}`);
    melde();
    // höchstens zwei Gruppen gleichzeitig
    const lauf = async (g) => {
      const { text } = await sample(`${ABSCHREIBEN.replace("Nebenkostenabrechnung", art)}\n\nSeitennummern der Bilder in Reihenfolge: ${g.map((s) => s.nr).join(", ")}.`, { images: g.map((s) => s.bild), signal: ctl.signal });
      const teile = text.split(/^---\s*Seite\s*(\d+)\s*---\s*$/m);
      if (teile.length > 1) for (let i = 1; i < teile.length; i += 2) { const s = seiten[Number(teile[i]) - 1]; if (s) s.text = teile[i + 1].trim(); }
      else seiten[g[0].nr - 1].text = text.trim();
      fertig += g.length; melde();
    };
    for (let i = 0; i < gruppen.length; i += 2) await Promise.all(gruppen.slice(i, i + 2).map(lauf));
  }

  const wert = (inhalt, erkl) => (erkl ? `<button class="wert" type="button" aria-expanded="false" title="Antippen für die Erklärung" data-erkl="${esc(erkl)}">${inhalt}</button>` : inhalt);

  function ergebnisKarte(r) {
    const s1 = r.s1, f = s1.fehlerpotenzial, k = s1.kosten, w = s1.widerspruchsfrist;
    // Einordnung: belegte Fehler, begründeter Prüfbedarf; Hinweise und Vergleichswerte zählen nicht
    const fehlerAnz = f.anzahl.abweichung, klaeren = f.anzahl.auffaelligkeit;
    const titel = f.sicher > 0 ? `${euro(f.sicher)} müssen Sie nicht bezahlen.`

    const frist = w.status === "offen"

    const zeile = (p) => befundHtml(p, "bis ");

      ${r.s2.unterlagen.some((u) => u.arten.includes("vorjahresabrechnung")) ? `<div class="ablage"><input type="file" id="vz-datei" accept="application/pdf,image/jpeg,image/png,image/webp" multiple aria-label="Abrechnung des Vorjahres auswählen"><strong>Abrechnung des Vorjahres auswählen</strong><span class="leise">PDF oder Fotos</span></div>` : ""}

  async function unterlagePruefen(liste) {
    const status = (t) => { z.vzStatus = t; const el = $("vz-status"); if (el) el.textContent = t; };
    await sampleBereit;
    if (!sample) return status("Das Lesen funktioniert nur, wenn diese Seite in Claude geöffnet ist und Sie angemeldet sind.");
    $("vz-datei").disabled = true;
    ctl = new AbortController();
    const vorher = auswertung();
    const zr = vorher.zeitraum;
    try {
      status("Seiten werden vorbereitet …");
      const limits = await sample.limits().catch(() => ({}));
      const seiten = await bereiteVor(liste);
      await abschreiben(seiten, limits.images?.maxCount ?? 0, "Vorjahresabrechnung", status);
      status("Vorauszahlungen werden ermittelt …");
      const text = seiten.map((s, i) => `--- Seite ${i + 1} ---\n${s.text}`).join("\n\n").slice(0, 150000);
      const antwort = await sample.json(`Das folgende Dokument ist eine Nebenkostenabrechnung des Vorjahres, Kontoauszüge oder ein Mietkonto eines Mieters. Ermittle die monatlichen Vorauszahlungen (Abschläge) für Betriebskosten und für Heizkosten, die im Zeitraum ${zr ? `${zr.von} bis ${zr.bis}` : "des Abrechnungsjahres"} galten, jeweils mit dem Datum, ab dem der Betrag galt. In einer Vorjahresabrechnung steht das meist als neue monatliche Vorauszahlung ab einem Datum. Übernimm nur Beträge, die ausdrücklich als Vorauszahlung oder Abschlag für Betriebs- oder Heizkosten erkennbar sind. Teile eine Gesamtmiete nicht selbst auf. Zahlen genau übernehmen, nicht runden.
Ist das Dokument selbst eine Nebenkostenabrechnung, gib zusätzlich ihren Abrechnungszeitraum an.
Antworte nur mit JSON: {"dokument": "vorjahresabrechnung" | "kontoauszug" | "mietkonto" | "anderes", "verlauf": [{"ab": "YYYY-MM-DD", "betriebskosten": number | null, "heizkosten": number | null}], "abrechnungszeitraum": {"von": "YYYY-MM-DD", "bis": "YYYY-MM-DD"} | null, "hinweis": string}

${text}`, { modelTier: "complex", signal: ctl.signal });
      const verlauf = (Array.isArray(antwort?.verlauf) ? antwort.verlauf : [])
        .filter((v) => /^\d{4}-\d{2}-\d{2}$/.test(v?.ab ?? ""))
        .map((v) => ({ ab: v.ab, ...(typeof v.betriebskosten === "number" ? { betriebskosten: v.betriebskosten } : {}), ...(typeof v.heizkosten === "number" ? { heizkosten: v.heizkosten } : {}) }))
        .filter((v) => v.betriebskosten !== undefined || v.heizkosten !== undefined);
      const vj = antwort?.abrechnungszeitraum;
      const vjGueltig = vj && /^\d{4}-\d{2}-\d{2}$/.test(vj.von ?? "") && /^\d{4}-\d{2}-\d{2}$/.test(vj.bis ?? "");
      const zeitraumPasst = !!(antwort?.dokument === "vorjahresabrechnung" && vjGueltig && zr && P.schliesstAn(vj, zr));
      if (!verlauf.length && !zeitraumPasst) {
        status(vjGueltig ? `Der Zeitraum dieser Abrechnung (${datumDE(vj.von)} bis ${datumDE(vj.bis)}) schließt nicht an Ihre aktuelle Abrechnung an. Bitte laden Sie die Abrechnung des direkt vorhergehenden Jahres hoch.` : "In dieser Unterlage finden wir keine passenden Angaben. Bitte laden Sie die Abrechnung des Vorjahres hoch.");
        $("vz-datei").disabled = false;
        return;
      }
      if (verlauf.length) z.vorauszahlungen = { verlauf, quelle: antwort.dokument === "vorjahresabrechnung" ? "vorjahresabrechnung" : "kontoauszug" };
      if (zeitraumPasst) z.antworten["meta.zeitraumBestaetigt"] = true;
      z.brief = null; z.vzStatus = "";
      const nachher = auswertung();
      const saetze = [];
      const f02 = nachher.s2.auffaelligkeiten.find((p) => p.regelId === "F-02");
      if (zeitraumPasst && f02?.status === "abweichung") saetze.push(`Bestätigt: Die Abrechnung kam zu spät. Sie müssen die Nachzahlung von ${euro(f02.betrag ?? 0)} nicht zahlen.`);
      else if (zeitraumPasst) saetze.push("Der Abrechnungszeitraum ist bestätigt.");
      if (verlauf.length) {
        const fehlt = nachher.s2.auffaelligkeiten.filter((p) => p.regelId === "R-05" && p.status === "abweichung").reduce((x, p) => x + (p.betrag ?? 0), 0);
        const offen = nachher.s2.auffaelligkeiten.some((p) => p.regelId === "R-05" && p.status === "pruefbedarf");
        saetze.push(fehlt > 0 ? `Bei Ihren Vorauszahlungen fehlen ${euro(fehlt)}. Der Betrag zählt jetzt als sicherer Fehler und steht im Schreiben.` : offen ? "Für Ihre Vorauszahlungen reicht die Unterlage noch nicht." : "Ihre Vorauszahlungen wurden richtig angerechnet.");
      }
      z.vzErgebnis = saetze.join(" ");
      const y = window.scrollY; zeige(); window.scrollTo({ top: y });
    } catch (e) {
      status(e?.code === "cancelled" ? "" : "Die Unterlage konnte nicht gelesen werden. Bitte versuchen Sie es noch einmal.");
      const d = $("vz-datei"); if (d) d.disabled = false;
    }
  }

    return `<section class="karte" id="mv-karte"><h2>Mietvertrag hochladen (optional)</h2>
      <p class="leise">${offen ? `Damit prüfen wir ${offen === 1 ? "einen weiteren Punkt" : `${offen} weitere Punkte`}, zum Beispiel ob alle Kostenarten vereinbart sind.` : "Damit prüfen wir, ob alle Kostenarten vereinbart sind."}</p>
      <div class="ablage"><input type="file" id="mv-datei" accept="application/pdf,image/jpeg,image/png,image/webp" multiple aria-label="Mietvertrag auswählen (PDF oder Fotos)"><strong>Mietvertrag auswählen</strong><span class="leise">PDF oder Fotos</span></div>
      <p class="leise" id="mv-status" aria-live="polite">${esc(z.mvStatus)}</p></section>`;

  async function mietvertragPruefen(liste) {
    const status = (t) => { z.mvStatus = t; const el = $("mv-status"); if (el) el.textContent = t; };
    await sampleBereit;
    if (!sample) return status("Das Lesen funktioniert nur, wenn diese Seite in Claude geöffnet ist und Sie angemeldet sind.");
    $("mv-datei").disabled = true;
    ctl = new AbortController();
    try {
      status("Seiten werden vorbereitet …");
      const limits = await sample.limits().catch(() => ({}));
      const seiten = await bereiteVor(liste);
      await abschreiben(seiten, limits.images?.maxCount ?? 0, "Mietvertrag", status);
      status("Mietvertrag wird ausgewertet …");
      const text = seiten.map((s, i) => `--- Seite ${i + 1} ---\n${s.text}`).join("\n\n").slice(0, 150000);
      const mv = await sample.json(`Lies aus diesem deutschen Wohnraum-Mietvertrag die Vereinbarungen zu den Betriebskosten aus. Antworte nur mit JSON:
{"istMietvertrag": boolean, "pauschaleVereinbart": boolean | null (true, wenn statt Vorauszahlungen mit Abrechnung eine Betriebskostenpauschale vereinbart ist), "vereinbarteSonstigeKosten": string[] | null (alle ausdrücklich vereinbarten sonstigen Betriebskosten nach § 2 Nr. 17 BetrKV mit ihrer Bezeichnung; leere Liste, wenn keine vereinbart sind; null, wenn die Betriebskostenvereinbarung nicht enthalten ist), "aufzugAusgenommen": boolean | null (true, wenn Erdgeschosswohnungen ausdrücklich von den Aufzugskosten ausgenommen sind), "mietbeginn": string | null (Beginn des Mietverhältnisses als YYYY-MM-DD), "mietende": string | null (Ende des Mietverhältnisses als YYYY-MM-DD, nur wenn befristet oder gekündigt), "wohnflaeche": number | null (vereinbarte Wohnfläche in m²), "gewerbeImHaus": boolean | null (true, wenn der Vertrag Gewerbe im Haus erwähnt, z. B. Laden, Praxis, Gaststätte)}

${text}`, { modelTier: "complex", signal: ctl.signal });
      if (mv?.istMietvertrag === false) { status("Das sieht nicht nach einem Mietvertrag aus. Bitte laden Sie den Mietvertrag hoch."); $("mv-datei").disabled = false; return; }
      const daten = {};
      if (typeof mv?.pauschaleVereinbart === "boolean") daten.pauschaleVereinbart = mv.pauschaleVereinbart;
      if (Array.isArray(mv?.vereinbarteSonstigeKosten)) daten.vereinbarteSonstigeKosten = mv.vereinbarteSonstigeKosten.map(String);
      if (typeof mv?.aufzugAusgenommen === "boolean") daten.aufzugAusgenommen = mv.aufzugAusgenommen;
      const iso = (v) => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
      if (iso(mv?.mietbeginn)) daten.mietbeginn = mv.mietbeginn;
      if (iso(mv?.mietende)) daten.mietende = mv.mietende;
      if (typeof mv?.wohnflaeche === "number" && mv.wohnflaeche > 10 && mv.wohnflaeche < 1000) daten.wohnflaeche = mv.wohnflaeche;
      if (mv?.gewerbeImHaus === true) daten.gewerbeImHaus = true;
      const vorher = auswertung().s1.fehlerpotenzial;
      z.mietvertrag = daten; z.brief = null; z.mvStatus = "";
      const nachher = auswertung().s1.fehlerpotenzial;
      const neu = (nachher.anzahl.abweichung + nachher.anzahl.auffaelligkeit) - (vorher.anzahl.abweichung + vorher.anzahl.auffaelligkeit);
      const mehr = Math.round((nachher.sicher - vorher.sicher) * 100) / 100;
      z.mvDelta = neu > 0 ? `Ihr Mietvertrag ergibt ${neu === 1 ? "einen weiteren Fehler" : `${neu} weitere Fehler`}${mehr > 0 ? ` und ${euro(mehr)} mehr, die Sie nicht zahlen müssen` : ""}.` : "Ihr Mietvertrag ist geprüft. Er ergibt keine weiteren Fehler.";
      const y = window.scrollY; zeige(); window.scrollTo({ top: y });
    } catch (e) {
      status(e?.code === "cancelled" ? "" : "Der Mietvertrag konnte nicht gelesen werden. Bitte versuchen Sie es noch einmal.");
      const d = $("mv-datei"); if (d) d.disabled = false;
    }
  }

  function panel(s2) {
    if (z.panel === "schreiben") {
      const pers = P.personalisiereAnschreiben(s2.anschreiben, z.kontakt);
      const brief = z.brief ?? pers.text, betreff = pers.betreff;
      const k = z.kontakt;
      const feld = (id, titel, wert, mehrzeilig, typ = "text") => `<label class="feld" for="k-${id}">${titel}${mehrzeilig ? `<textarea id="k-${id}" data-kontakt="${id}" rows="2">${esc(wert ?? "")}</textarea>` : `<input id="k-${id}" data-kontakt="${id}" type="${typ}" value="${esc(wert ?? "")}">`}</label>`;
      const gefunden = ["mieterName", "vermieterName", "vermieterEmail"].some((x) => k[x]);
      return `<section class="karte" id="panel"><h2>Ihr Schreiben an die Hausverwaltung</h2>
        <p class="leise">${gefunden ? "Diese Angaben haben wir aus Ihrer Abrechnung übernommen. Bitte kurz prüfen." : "Bitte ergänzen Sie Ihre Angaben."}</p>
        <div class="zwei">${feld("mieterName", "Ihr Name", k.mieterName)}${feld("mieternummer", "Mieternummer", k.mieternummer)}</div>
        ${feld("mieterAnschrift", "Ihre Anschrift", k.mieterAnschrift, true)}
        <div class="zwei">${feld("vermieterName", "Hausverwaltung", k.vermieterName)}${feld("vermieterEmail", "E-Mail der Hausverwaltung", k.vermieterEmail, false, "email")}</div>
        ${feld("vermieterAnschrift", "Anschrift der Hausverwaltung", k.vermieterAnschrift, true)}
        <label class="feld" for="anschreiben"><span class="leise" style="font-weight:400">Betreff: ${esc(betreff)}</span><textarea id="anschreiben" rows="14">${esc(brief)}</textarea></label>
        <div class="reihe"><a class="knopf haupt" id="mailto" href="mailto:${pers.an ?? ""}?subject=${encodeURIComponent(betreff)}&body=${encodeURIComponent(brief)}">${pers.an ? "E-Mail an die Hausverwaltung" : "Per E-Mail senden"}</a><button class="knopf neben" type="button" data-aktion="kopieren">Text kopieren</button></div></section>`;
    }
    if (z.panel === "beratung") {
      if (z.beratung) return `<section class="karte" id="panel" role="status"><h2>Danke, wir melden uns.</h2><p class="leise">Im Test wird nichts gesendet.</p></section>`;
      return `<form class="karte" id="panel" novalidate><h2>Unsere Experten übernehmen das für Sie</h2>
        <div class="zwei"><label class="feld" for="b-name">Name<input id="b-name" autocomplete="name"></label><label class="feld" for="b-kontakt">E-Mail oder Telefon<input id="b-kontakt" autocomplete="email"></label></div>
        <label class="einwilligung" for="b-einwilligung"><input type="checkbox" id="b-einwilligung"><span>Biati Solutions darf mich zu meiner Abrechnung kontaktieren.</span></label>
        ${z.fehlerBeratung ? `<p class="meldung" role="alert">${esc(z.fehlerBeratung)}</p>` : ""}
        <div><button class="knopf haupt" type="submit">Rückruf anfordern</button></div></form>`;
    }
    return "";
  }

  // Zum Nachprüfen im Test: was ausgelesen wurde
  function gelesen(r) {
    const zeilen = r.positionen.map((p) => `<tr><td>${esc(p.name)}</td><td>${euro(p.betrag)}</td></tr>`).join("") +
      (r.heizkosten !== null ? `<tr><td>Heiz- und Warmwasserkosten</td><td>${euro(r.heizkosten)}</td></tr>` : "");
    return `<details class="karte"><summary>Ausgelesene Beträge ansehen</summary><table class="tabelle"><tbody>${zeilen}</tbody></table></details>` + pruefweg(r);
  }

  // Zwei Unterschritte: 1. Formelprüfung Zeile für Zeile, 2. KI-Kontrolle gegen das Dokument
  function pruefweg(r) {
    const p = r.protokoll, k = z.kontrolle;
    const TEXT = { ok: "in Ordnung", fehler: "Fehler", pruefbedarf: "Prüfbedarf", hinweis: "Hinweis", offen: "offene Frage" };
    const zeilen = p.zeilen.map((x) => `<tr><td>${x.nr}. ${esc(x.bezeichnung)}<br><small class="leise">${x.pruefungen.length} ${x.pruefungen.length === 1 ? "Prüfung" : "Prüfungen"}</small></td><td>${x.ergebnis === "ok" ? "" : "<b>"}${TEXT[x.ergebnis]}${x.ergebnis === "ok" ? "" : "</b>"}</td></tr>`).join("");
    let kontrolle;
    if (!k) kontrolle = `<p class="leise">Im Beispiel wird die zweite Kontrolle nicht ausgeführt.</p>`;
    else if (!k.durchgefuehrt) kontrolle = `<p>Die zweite Kontrolle konnte nicht ausgeführt werden. Das Ergebnis ist deshalb nicht bestätigt.</p>`;
    else {
      const punkte = [
        ...k.lesefehler.map((x) => `Zeile ${x.nr} „${esc(x.bezeichnung)}“: ${esc(x.abweichung)}`),
        ...k.fehlendeZeilen.map((x) => `Zeile fehlt: „${esc(x.bezeichnung)}“${x.betrag !== undefined ? ` (${euro(x.betrag)})` : ""}`),
        ...k.auffaelligkeiten.map((x) => `${esc(x.beschreibung)} Textstelle: „${esc(x.textstelle)}“ Dieser Punkt steht oben unter „Das haben wir gefunden“.`),
      ];
      kontrolle = `<p>${k.zeilenBestaetigt} von ${k.zeilenGesamt} Zeilen stimmen mit Ihrem Dokument überein.${k.bestanden ? " Keine Zeile fehlt, nichts Zusätzliches aufgefallen." : ""}</p>${punkte.length ? `<ul class="belege" style="display:grid;gap:4px">${punkte.map((t) => `<li>${t}</li>`).join("")}</ul>` : ""}`;
    }
    return `<details class="karte"><summary>So haben wir geprüft</summary>
      <h3 style="margin:12px 0 4px">1. Formelprüfung</h3>
      <p>${p.zeilen.length} Zeilen, ${p.anzahlPruefungen} Prüfungen. ${p.vollstaendigkeit.ok ? "Die Summe aller Zeilen ergibt die ausgewiesene Gesamtsumme." : "Die Summe der Zeilen ergibt nicht die ausgewiesene Gesamtsumme."}</p>
      <table class="tabelle"><tbody>${zeilen}</tbody></table>
      <h3 style="margin:16px 0 4px">2. Kontrolle durch die KI</h3>${kontrolle}</details>`;
  }

  // ---------- Bedienung ----------
  const ergebnis = $("ergebnis");
  ergebnis.addEventListener("click", async (ev) => {
    // Klick auf einen berechneten Wert: Erklärung darunter ein- oder ausblenden
    const w = ev.target.closest("button.wert");
    if (w) {
      const anker = w.closest(".kopfzeile") ?? w.closest("h1") ?? w;
      const offen = anker.nextElementSibling?.classList.contains("erkl");
      if (offen) anker.nextElementSibling.remove();
      else {
        const e = document.createElement(anker === w ? "span" : "p");
        e.className = "erkl"; e.setAttribute("role", "note"); e.textContent = w.dataset.erkl;
        anker.insertAdjacentElement("afterend", e);
      }
      w.setAttribute("aria-expanded", String(!offen));
      return;
    }
    const k = ev.target.closest("[data-aktion]");
    if (!k) return;
    const a = k.dataset.aktion;
    if (a === "neu") {
      z = null; ergebnis.innerHTML = ""; $("start").hidden = false; window.scrollTo({ top: 0 });
    } else if (a === "zugang") {
      const wert = $("zugang").value;
      z.fehlerZugang = /^\d{4}-\d{2}-\d{2}$/.test(wert) ? "" : "Bitte ein Datum wählen.";
      if (!z.fehlerZugang) { z.antworten["meta.zugangAm"] = wert; z.brief = null; }
      zeige();
    } else if (a === "janein") {
      z.antworten[k.dataset.feld] = k.dataset.wert === "ja";
      z.brief = null;
      const y = window.scrollY; zeige(); window.scrollTo({ top: y });
    } else if (a === "plz") {
      const wert = $("plz").value.replace(/\s/g, "");
      z.fehlerPlz = /^\d{5}$/.test(wert) ? "" : "Bitte eine fünfstellige Postleitzahl eingeben.";
      if (!z.fehlerPlz) z.antworten["meta.plz"] = wert;
      zeige();
    } else if (a === "freischalten") {
      z.bezahlt = true; zeige(); $("empfehlung")?.scrollIntoView({ behavior: "smooth", block: "start" });
    } else if (a === "schreiben" || a === "beratung") {
      z.panel = a; zeige(); $("panel")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else if (a === "kopieren") {
      const r = auswertung();
      try { await navigator.clipboard.writeText(`Betreff: ${P.personalisiereAnschreiben(r.s2.anschreiben, z.kontakt).betreff}\n\n${$("anschreiben").value}`); k.textContent = "Kopiert"; }
      catch { $("anschreiben").select(); }
    }
  });
  ergebnis.addEventListener("input", (ev) => {
    if (ev.target.id !== "anschreiben") return;
    z.brief = ev.target.value;
    const pers = P.personalisiereAnschreiben(auswertung().s2.anschreiben, z.kontakt);
    $("mailto").href = `mailto:${pers.an ?? ""}?subject=${encodeURIComponent(pers.betreff)}&body=${encodeURIComponent(z.brief)}`;
  });
  // Angaben für das Schreiben: nach dem Ändern Text neu zusammensetzen
  ergebnis.addEventListener("change", (ev) => {
    if (ev.target.id === "mv-datei" && ev.target.files.length) return mietvertragPruefen([...ev.target.files]);
    if (ev.target.id === "vz-datei" && ev.target.files.length) return unterlagePruefen([...ev.target.files]);
    const feld = ev.target.dataset?.kontakt;
    if (!feld) return;
    z.kontakt[feld] = ev.target.value.trim();
    z.brief = null;
    const y = window.scrollY; zeige(); window.scrollTo({ top: y });
  });
  ergebnis.addEventListener("submit", (ev) => {
    if (ev.target.id !== "panel") return;
    ev.preventDefault();
    const name = $("b-name").value.trim(), kontakt = $("b-kontakt").value.trim();
    z.fehlerBeratung = name.length < 2 ? "Bitte Ihren Namen angeben."
      : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(kontakt) && kontakt.replace(/\D/g, "").length < 6 ? "Bitte E-Mail-Adresse oder Telefonnummer angeben."
      : !$("b-einwilligung").checked ? "Bitte bestätigen Sie, dass wir Sie kontaktieren dürfen." : "";
    if (!z.fehlerBeratung) z.beratung = true;
    zeige();
    if (!z.beratung) { $("b-name").value = name; $("b-kontakt").value = kontakt; }
  });
})();
</script>
