name: Qualitätskontrolle

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biaticheck
          POSTGRES_PASSWORD: biaticheck
          POSTGRES_DB: biaticheck_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U biaticheck" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://biaticheck:biaticheck@localhost:5432/biaticheck_test
      TEST_DATABASE_URL: postgresql://biaticheck:biaticheck@localhost:5432/biaticheck_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typprüfung
        run: pnpm -r typecheck
      - name: Datenbank migrieren
        run: pnpm --filter @biaticheck/web db:migrate
      - name: Tests (Prüfkern, Auslesen, Web)
        run: pnpm -r test
      - name: Build
        run: pnpm --filter @biaticheck/web build
      - name: Browser installieren
        run: pnpm --filter @biaticheck/web exec playwright install --with-deps chromium
      - name: End-to-End-Tests (Handy + Desktop)
        run: pnpm --filter @biaticheck/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
